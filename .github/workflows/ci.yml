name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build deliberately: `vite build` uses esbuild, which
      # strips types without checking them, and never compiles api/ at all
      # (Vercel builds that separately). This is the only step that sees them.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
